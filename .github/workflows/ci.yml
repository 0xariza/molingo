name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: molingo
          POSTGRES_PASSWORD: molingo
          POSTGRES_DB: molingo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U molingo" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://molingo:molingo@localhost:5432/molingo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known high/critical vulnerabilities in production dependencies fail the build
      - run: pnpm audit:prod
      # Formatting, types, lint, i18n parity, RTL lint, unit + integration tests
      - run: pnpm check
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium webkit
      # Builds the app and runs the end-to-end suite against it (own molingo_e2e database)
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
